<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perrito con Flores</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            transition: background-color 1.5s ease-in-out;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Canvas de fondo (Lluvia y Pétalos) */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Canvas de la Galaxia Interactiva */
        #galaxyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.8s ease-in-out;
            background: radial-gradient(circle at center, #0B0813 0%, #030206 100%);
            cursor: default;
        }

        /* Capa de Arcoíris suave */
        .rainbow-arc {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
            background: radial-gradient(circle at 50% 120%, 
                rgba(255, 99, 132, 0.35) 0%, 
                rgba(255, 159, 64, 0.35) 15%, 
                rgba(255, 205, 86, 0.35) 30%, 
                rgba(75, 192, 192, 0.35) 45%, 
                rgba(54, 162, 235, 0.35) 60%, 
                rgba(153, 102, 255, 0.35) 75%, 
                transparent 85%);
            z-index: 1;
        }

        .fade-transition {
            transition: opacity 1s ease-in-out;
        }

        /* Efecto Zoom In Dramático */
        .zoom-dramatic {
            transition: transform 1.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 1.8s ease-in-out !important;
            transform: scale(8) translateY(-20%) !important;
            opacity: 0 !important;
        }

        /* Pulso sutil para el texto sin marco */
        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-subtle {
            animation: subtle-pulse 2.5s ease-in-out infinite;
        }

        .text-handwritten {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body class="bg-gray-800 text-gray-100 min-h-screen flex flex-col items-center justify-between relative" id="bodyBg">

    <!-- Canvas de Lluvia / Pétalos -->
    <canvas id="bgCanvas"></canvas>

    <!-- Canvas de Galaxia Interactiva -->
    <canvas id="galaxyCanvas"></canvas>
    
    <!-- Capa del Arcoíris -->
    <div id="rainbowLayer" class="rainbow-arc"></div>

    <!-- Título Principal Superior -->
    <header class="relative z-10 w-full pt-8 px-4 text-center">
        <h1 id="mainTitle" class="text-3xl sm:text-5xl font-extrabold tracking-wide text-gray-300 drop-shadow-md transition-all duration-700">
            No me alcanzo para las flores :(
        </h1>
    </header>

    <!-- Frase "Presiona la flor" (Texto Plano sin Marcos ni Fondos) -->
    <div id="sideTextPanel" class="fixed right-6 sm:right-20 top-1/2 -translate-y-1/2 z-20 opacity-0 translate-x-12 transition-all duration-1000 pointer-events-none flex flex-col items-center">
        <div class="text-amber-900 font-bold text-3xl sm:text-5xl tracking-wide text-handwritten animate-subtle drop-shadow-[0_2px_4px_rgba(255,255,255,0.8)] flex items-center gap-3">
            <span>Presiona la flor</span>
            <span class="text-3xl sm:text-4xl">👈</span>
        </div>
    </div>

    <!-- Contenedor Principal de Imágenes centradas en la parte inferior -->
    <main class="relative z-10 w-full flex-1 flex items-end justify-center pb-0">
        <div class="relative w-full max-w-lg flex justify-center items-end">
            
            <!-- Imagen 1: Dog.png -->
            <img 
                id="dogSad" 
                src="./imagenes/Dog.png" 
                alt="Perrito sin flores" 
                class="w-auto h-auto max-h-[55vh] max-w-full object-contain fade-transition opacity-100 block pointer-events-none"
                onerror="this.onerror=null; this.src='https://placehold.co/400x400/333333/ffffff?text=Dog.png';"
            />

            <!-- Imagen 2: Dog 1.png (Misma posición exacta, cliqueable directamente) -->
            <img 
                id="dogHappy" 
                src="./imagenes/Dog 1.png" 
                alt="Perrito con flores" 
                class="w-auto h-auto max-h-[55vh] max-w-full object-contain fade-transition opacity-0 absolute bottom-0 cursor-pointer pointer-events-none"
                onclick="startGalaxyTransition()"
                onerror="this.onerror=null; this.src='https://placehold.co/400x400/fde047/333333?text=Dog+1.png';"
            />

        </div>
    </main>

    <!-- Modal de Mensaje para Girasoles Especiales -->
    <div id="flowerModal" class="fixed inset-0 bg-black/70 z-50 opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-amber-50 to-orange-100 text-gray-800 rounded-2xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-2 border-amber-300 transform scale-95 transition-transform duration-300 text-center relative" id="modalCard">
            <div class="text-4xl mb-3">🌻✨</div>
            <p id="modalText" class="text-xl sm:text-2xl font-serif text-amber-950 mb-6 leading-relaxed">
                <!-- Texto dinámico -->
            </p>
            <button onclick="closeModal()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-6 rounded-full shadow-md transition-all transform hover:scale-105 active:scale-95">
                Cerrar ❤️
            </button>
        </div>
    </div>

    <script>
        // DOM References
        const bodyBg = document.getElementById('bodyBg');
        const bgCanvas = document.getElementById('bgCanvas');
        const galaxyCanvas = document.getElementById('galaxyCanvas');
        const rainbowLayer = document.getElementById('rainbowLayer');
        const mainTitle = document.getElementById('mainTitle');
        const dogSad = document.getElementById('dogSad');
        const dogHappy = document.getElementById('dogHappy');
        const sideTextPanel = document.getElementById('sideTextPanel');
        const flowerModal = document.getElementById('flowerModal');
        const modalCard = document.getElementById('modalCard');
        const modalText = document.getElementById('modalText');

        const ctxBg = bgCanvas.getContext('2d');
        const ctxGalaxy = galaxyCanvas.getContext('2d');

        let currentScene = "rain"; // "rain", "sun", "galaxy"
        let isTransitioning = false;

        // Responsive Resizing
        function resizeAll() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            galaxyCanvas.width = window.innerWidth;
            galaxyCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeAll);
        resizeAll();

        // --- 1. Lluvia y Pétalos (Fondo Inicial) ---
        const drops = Array.from({ length: 130 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            length: Math.random() * 20 + 8,
            speed: Math.random() * 6 + 4,
            opacity: Math.random() * 0.4 + 0.1
        }));

        const petals = Array.from({ length: 35 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 7 + 4,
            speedY: Math.random() * 1.5 + 0.5,
            speedX: Math.random() * 1 - 0.5,
            color: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#fbe7c6', '#fde047'][Math.floor(Math.random() * 5)],
            angle: Math.random() * 360
        }));

        // --- 2. Galaxia de 8 Brazos Interactiva ---
        let mouseX = 0;
        let mouseY = 0;
        let targetOffsetX = 0;
        let targetOffsetY = 0;
        let currentOffsetX = 0;
        let currentOffsetY = 0;
        let galaxyRotation = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;
            checkSunflowersHover(e.clientX, e.clientY);
        });

        // Configuración de la Galaxia
        const ARM_COUNT = 8;
        const PARTICLES_PER_ARM = 220;
        const galaxyParticles = [];
        const secondarySunflowers = [];
        const specialSunflowers = []; // 3 Girasoles especiales
        const sparkles = []; // Explosiones focalizadas

        const specialMessages = [
            "Nuse que poner. 🌻",
            "Izquierda, Derecha, Arriba y En frente ✨",
            "Vivan las matronas Yiaaaaa ❤️"
        ];

        function initGalaxy() {
            galaxyParticles.length = 0;
            
            // Generación de Partículas en 8 brazos intercalados
            for (let arm = 0; arm < ARM_COUNT; arm++) {
                const isSparkArm = (arm % 2 === 0);
                const armAngleOffset = (arm * 2 * Math.PI) / ARM_COUNT;

                for (let i = 0; i < PARTICLES_PER_ARM; i++) {
                    const distRatio = Math.pow(Math.random(), 1.2);
                    const distance = distRatio * (Math.min(window.innerWidth, window.innerHeight) * 0.65) + 35;
                    const spiralAngle = distance * 0.008;
                    const spread = (Math.random() - 0.5) * (0.35 + distRatio * 0.35);
                    const angle = armAngleOffset + spiralAngle + spread;

                    galaxyParticles.push({
                        isSpark: isSparkArm,
                        distance: distance,
                        angle: angle,
                        size: isSparkArm ? Math.random() * 3 + 1 : Math.random() * 6 + 3,
                        color: isSparkArm 
                            ? ['#FFF700', '#FFEA00', '#FFD700', '#FFFFFF', '#FFAA00'][Math.floor(Math.random() * 5)]
                            : ['#FF69B4', '#FFB6C1', '#FFA07A', '#FFD700', '#FF6347', '#E6E6FA'][Math.floor(Math.random() * 6)],
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.04
                    });
                }
            }

            // Girasoles Pequeños
            secondarySunflowers.length = 0;
            for (let i = 0; i < 6; i++) {
                secondarySunflowers.push(createSecondarySunflower());
            }

            // 3 Girasoles Especiales (Tamaño reducido a 0.3 - 0.35)
            specialSunflowers.length = 0;
            for (let i = 0; i < 3; i++) {
                const angle = (i * (Math.PI * 2 / 3)) + Math.PI / 6;
                const distance = Math.min(window.innerWidth, window.innerHeight) * 0.32;
                specialSunflowers.push({
                    distance: distance,
                    angle: angle,
                    scale: 0.32, // Reducido para mejor armonía
                    orbitSpeed: 0.0015,
                    message: specialMessages[i],
                    screenX: 0,
                    screenY: 0,
                    radius: 20,
                    hovered: false
                });
            }
        }

        function createSecondarySunflower() {
            const distance = Math.random() * (Math.min(window.innerWidth, window.innerHeight) * 0.35) + 80;
            const angle = Math.random() * Math.PI * 2;
            return {
                distance: distance,
                angle: angle,
                scale: Math.random() * 0.2 + 0.18,
                orbitSpeed: (Math.random() * 0.002 + 0.001) * (Math.random() > 0.5 ? 1 : -1),
                screenX: 0,
                screenY: 0,
                radius: 15,
                hovered: false
            };
        }

        // --- Dibujar Girasol ---
        function drawSunflower(ctx, x, y, scale, hasHalo = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Halo Resplandeciente Especial
            if (hasHalo) {
                const pulse = Math.sin(Date.now() * 0.005) * 10;
                const haloGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 85 + pulse);
                haloGrad.addColorStop(0, 'rgba(255, 215, 0, 0.9)');
                haloGrad.addColorStop(0.5, 'rgba(255, 140, 0, 0.4)');
                haloGrad.addColorStop(1, 'rgba(255, 200, 0, 0)');
                ctx.fillStyle = haloGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 85 + pulse, 0, Math.PI * 2);
                ctx.fill();
            } else {
                const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, 70);
                glow.addColorStop(0, 'rgba(255, 230, 0, 0.9)');
                glow.addColorStop(0.5, 'rgba(255, 170, 0, 0.3)');
                glow.addColorStop(1, 'rgba(255, 140, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, 0, 70, 0, Math.PI * 2);
                ctx.fill();
            }

            // Pétalos Dorados
            const layers = [
                { count: 16, length: 48, width: 15, color: '#FFD700' },
                { count: 16, length: 40, width: 13, color: '#FFAB00' }
            ];

            layers.forEach((layer, idx) => {
                const step = (Math.PI * 2) / layer.count;
                const offset = idx * (step / 2);
                for (let i = 0; i < layer.count; i++) {
                    const angle = i * step + offset;
                    ctx.save();
                    ctx.rotate(angle);
                    ctx.fillStyle = layer.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -12);
                    ctx.quadraticCurveTo(layer.width, -layer.length / 2, 0, -layer.length);
                    ctx.quadraticCurveTo(-layer.width, -layer.length / 2, 0, -12);
                    ctx.fill();
                    ctx.restore();
                }
            });

            // Núcleo del Girasol
            ctx.fillStyle = '#4A2A0C';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2A1504';
            const seeds = 50;
            const phi = (1 + Math.sqrt(5)) / 2;
            for (let i = 0; i < seeds; i++) {
                const r = Math.sqrt(i) * 2;
                const theta = i * 2 * Math.PI / phi;
                ctx.beginPath();
                ctx.arc(r * Math.cos(theta), r * Math.sin(theta), 1, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function triggerFocalSparkle() {
            if (currentScene !== "galaxy") return;
            
            const dist = Math.random() * (Math.min(window.innerWidth, window.innerHeight) * 0.4) + 40;
            const angle = Math.random() * Math.PI * 2;
            const duration = Math.floor(Math.random() * 20 + 20);

            sparkles.push({
                distance: dist,
                angle: angle,
                maxRadius: Math.random() * 14 + 8,
                currentFrame: 0,
                maxFrames: duration,
                color: ['#FFFFFF', '#FFF700', '#FFEA00', '#00FFFF'][Math.floor(Math.random() * 4)]
            });
        }

        setInterval(() => {
            if (currentScene === "galaxy" && Math.random() < 0.7) {
                triggerFocalSparkle();
            }
        }, 800);

        function checkSunflowersHover(clientX, clientY) {
            if (currentScene !== "galaxy") return;
            let isAnyHovered = false;

            // Secundarios
            secondarySunflowers.forEach(sf => {
                const dx = clientX - sf.screenX;
                const dy = clientY - sf.screenY;
                sf.hovered = Math.sqrt(dx * dx + dy * dy) < (sf.radius * sf.scale * 2.5);
                if (sf.hovered) isAnyHovered = true;
            });

            // Especiales
            specialSunflowers.forEach(sf => {
                const dx = clientX - sf.screenX;
                const dy = clientY - sf.screenY;
                sf.hovered = Math.sqrt(dx * dx + dy * dy) < (sf.radius * sf.scale * 3);
                if (sf.hovered) isAnyHovered = true;
            });

            galaxyCanvas.style.cursor = isAnyHovered ? 'pointer' : 'default';
        }

        galaxyCanvas.addEventListener('click', (e) => {
            if (currentScene !== "galaxy") return;

            // Click en Especiales (Abre Modal)
            specialSunflowers.forEach(sf => {
                const dx = e.clientX - sf.screenX;
                const dy = e.clientY - sf.screenY;
                if (Math.sqrt(dx * dx + dy * dy) < (sf.radius * sf.scale * 3)) {
                    confetti({
                        particleCount: 50,
                        spread: 80,
                        origin: { x: sf.screenX / window.innerWidth, y: sf.screenY / window.innerHeight },
                        colors: ['#FFD700', '#FFAA00', '#FF69B4', '#FFFFFF']
                    });
                    openModal(sf.message);
                }
            });

            // Click en Secundarios (Efecto y Reaparición)
            secondarySunflowers.forEach((sf, idx) => {
                const dx = e.clientX - sf.screenX;
                const dy = e.clientY - sf.screenY;
                if (Math.sqrt(dx * dx + dy * dy) < (sf.radius * sf.scale * 2.5)) {
                    confetti({
                        particleCount: 20,
                        spread: 50,
                        origin: { x: sf.screenX / window.innerWidth, y: sf.screenY / window.innerHeight },
                        colors: ['#FFD700', '#FFFFFF']
                    });
                    secondarySunflowers[idx] = createSecondarySunflower();
                }
            });
        });

        function openModal(text) {
            modalText.innerText = text;
            flowerModal.classList.remove('opacity-0', 'pointer-events-none');
            flowerModal.classList.add('opacity-100', 'pointer-events-auto');
            modalCard.classList.remove('scale-95');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            flowerModal.classList.remove('opacity-100', 'pointer-events-auto');
            flowerModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
        }

        // Main Loop
        function animate() {
            ctxBg.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            if (currentScene === "rain") {
                ctxBg.strokeStyle = '#ffffff';
                ctxBg.lineWidth = 1;
                ctxBg.lineCap = 'round';

                drops.forEach(d => {
                    ctxBg.beginPath();
                    ctxBg.globalAlpha = d.opacity;
                    ctxBg.moveTo(d.x, d.y);
                    ctxBg.lineTo(d.x, d.y + d.length);
                    ctxBg.stroke();

                    d.y += d.speed;
                    if (d.y > bgCanvas.height) {
                        d.y = -d.length;
                        d.x = Math.random() * bgCanvas.width;
                    }
                });
            } else if (currentScene === "sun") {
                petals.forEach(p => {
                    ctxBg.save();
                    ctxBg.globalAlpha = 0.65;
                    ctxBg.fillStyle = p.color;
                    ctxBg.translate(p.x, p.y);
                    ctxBg.rotate((p.angle * Math.PI) / 180);
                    ctxBg.beginPath();
                    ctxBg.ellipse(0, 0, p.size, p.size / 2, 0, 0, 2 * Math.PI);
                    ctxBg.fill();
                    ctxBg.restore();

                    p.y += p.speedY;
                    p.x += Math.sin(p.y * 0.02) * 0.5;
                    p.angle += 0.5;

                    if (p.y > bgCanvas.height) {
                        p.y = -10;
                        p.x = Math.random() * bgCanvas.width;
                    }
                });
            }

            // Render Galaxia
            if (currentScene === "galaxy") {
                ctxGalaxy.clearRect(0, 0, galaxyCanvas.width, galaxyCanvas.height);

                // Desplazamiento sutil con el ratón
                targetOffsetX = mouseX * 25;
                targetOffsetY = mouseY * 25;
                currentOffsetX += (targetOffsetX - currentOffsetX) * 0.05;
                currentOffsetY += (targetOffsetY - currentOffsetY) * 0.05;

                galaxyRotation += 0.0025;

                const centerX = (galaxyCanvas.width / 2) + currentOffsetX;
                const centerY = (galaxyCanvas.height / 2) + currentOffsetY;

                // 1. Dibujar Partículas de los 8 Brazos
                galaxyParticles.forEach(p => {
                    const currAngle = p.angle + galaxyRotation;
                    const x = centerX + Math.cos(currAngle) * p.distance;
                    const y = centerY + Math.sin(currAngle) * p.distance;

                    ctxGalaxy.save();
                    ctxGalaxy.translate(x, y);

                    if (p.isSpark) {
                        ctxGalaxy.fillStyle = p.color;
                        ctxGalaxy.shadowColor = p.color;
                        ctxGalaxy.shadowBlur = 6;
                        ctxGalaxy.beginPath();
                        ctxGalaxy.arc(0, 0, p.size, 0, Math.PI * 2);
                        ctxGalaxy.fill();
                    } else {
                        ctxGalaxy.rotate(p.rotation + (p.rotSpeed * 10));
                        ctxGalaxy.fillStyle = p.color;
                        ctxGalaxy.shadowColor = p.color;
                        ctxGalaxy.shadowBlur = 4;
                        ctxGalaxy.beginPath();
                        ctxGalaxy.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                        ctxGalaxy.fill();
                    }
                    ctxGalaxy.restore();
                });

                // 2. Dibujar Explosiones de Brillo Focalizadas
                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const sp = sparkles[i];
                    sp.currentFrame++;
                    
                    if (sp.currentFrame >= sp.maxFrames) {
                        sparkles.splice(i, 1);
                        continue;
                    }

                    const currAngle = sp.angle + galaxyRotation;
                    const x = centerX + Math.cos(currAngle) * sp.distance;
                    const y = centerY + Math.sin(currAngle) * sp.distance;
                    const progress = sp.currentFrame / sp.maxFrames;
                    const opacity = Math.sin(progress * Math.PI);
                    const radius = sp.maxRadius * Math.sin(progress * Math.PI);

                    ctxGalaxy.save();
                    ctxGalaxy.translate(x, y);
                    ctxGalaxy.globalAlpha = opacity;
                    
                    const g = ctxGalaxy.createRadialGradient(0, 0, 0, 0, 0, radius);
                    g.addColorStop(0, '#FFFFFF');
                    g.addColorStop(0.4, sp.color);
                    g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    
                    ctxGalaxy.fillStyle = g;
                    ctxGalaxy.beginPath();
                    ctxGalaxy.arc(0, 0, radius, 0, Math.PI * 2);
                    ctxGalaxy.fill();

                    ctxGalaxy.strokeStyle = '#FFFFFF';
                    ctxGalaxy.lineWidth = 1.5;
                    ctxGalaxy.beginPath();
                    ctxGalaxy.moveTo(-radius * 1.3, 0); ctxGalaxy.lineTo(radius * 1.3, 0);
                    ctxGalaxy.moveTo(0, -radius * 1.3); ctxGalaxy.lineTo(0, radius * 1.3);
                    ctxGalaxy.stroke();

                    ctxGalaxy.restore();
                }

                // 3. Dibujar Girasoles Secundarios
                secondarySunflowers.forEach(sf => {
                    sf.angle += sf.orbitSpeed;
                    const currAngle = sf.angle + galaxyRotation;
                    sf.screenX = centerX + Math.cos(currAngle) * sf.distance;
                    sf.screenY = centerY + Math.sin(currAngle) * sf.distance;

                    const activeScale = sf.scale * (sf.hovered ? 1.25 : 1.0);
                    drawSunflower(ctxGalaxy, sf.screenX, sf.screenY, activeScale);
                });

                // 4. Dibujar 3 Girasoles Especiales (con Halo)
                specialSunflowers.forEach(sf => {
                    sf.angle += sf.orbitSpeed;
                    const currAngle = sf.angle + galaxyRotation;
                    sf.screenX = centerX + Math.cos(currAngle) * sf.distance;
                    sf.screenY = centerY + Math.sin(currAngle) * sf.distance;

                    const activeScale = sf.scale * (sf.hovered ? 1.2 : 1.0);
                    drawSunflower(ctxGalaxy, sf.screenX, sf.screenY, activeScale, true);
                });

                // 5. Girasol Principal Central
                drawSunflower(ctxGalaxy, centerX, centerY, 1.2 + Math.sin(Date.now() * 0.002) * 0.04);
            }

            requestAnimationFrame(animate);
        }

        // Transición Automática a los 5 Segundos
        setTimeout(() => {
            currentScene = "sun";

            bodyBg.classList.remove('bg-gray-800', 'text-gray-100');
            bodyBg.classList.add('bg-amber-100', 'text-gray-800');
            rainbowLayer.style.opacity = '1';

            mainTitle.innerText = "ahh te la creiste";
            mainTitle.classList.remove('text-gray-300');
            mainTitle.classList.add('text-amber-900', 'scale-105');

            dogSad.classList.remove('opacity-100');
            dogSad.classList.add('opacity-0');

            dogHappy.classList.remove('opacity-0', 'pointer-events-none');
            dogHappy.classList.add('opacity-100', 'pointer-events-auto');

            sideTextPanel.classList.remove('opacity-0', 'translate-x-12');
            sideTextPanel.classList.add('opacity-100', 'translate-x-0');

        }, 5000);

        function startGalaxyTransition() {
            if (isTransitioning) return;
            isTransitioning = true;

            confetti({
                particleCount: 90,
                spread: 100,
                origin: { y: 0.8 },
                colors: ['#ffd700', '#ffb703', '#ff4d6d', '#ffffff']
            });

            mainTitle.style.opacity = '0';
            sideTextPanel.style.opacity = '0';

            dogHappy.classList.add('zoom-dramatic');

            setTimeout(() => {
                initGalaxy();
                currentScene = "galaxy";
                galaxyCanvas.style.pointerEvents = "auto";
                galaxyCanvas.style.opacity = "1";
            }, 750);
        }

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="h-full w-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Perrito con Flores</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* Prevención de selección y gestos predeterminados de iOS */
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100vh;
            height: 100dvh; /* Dynamic Viewport Height para iOS Safari */
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none; /* Bloquea el efecto rebote de iOS */
            touch-action: manipulation;
            font-family: 'Fredoka', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1f2937;
        }

        /* Respetar la zona segura (Notch, Dynamic Island y barra de inicio) */
        .safe-area-top {
            padding-top: max(1rem, env(safe-area-inset-top));
        }
        .safe-area-bottom {
            padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
        }
        .safe-area-left {
            padding-left: max(1rem, env(safe-area-inset-left));
        }
        .safe-area-right {
            padding-right: max(1rem, env(safe-area-inset-right));
        }

        /* Fullscreen Canvas Styles */
        .fullscreen-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #bgCanvas {
            z-index: 0;
            pointer-events: none;
        }

        #galaxyCanvas {
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease-in-out;
            background: radial-gradient(circle at center, #0B0813 0%, #030206 100%);
        }

        .rainbow-arc {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            pointer-events: none;
            background: radial-gradient(circle at 50% 120%, 
                rgba(255, 99, 132, 0.35) 0%, 
                rgba(255, 159, 64, 0.35) 15%, 
                rgba(255, 205, 86, 0.35) 30%, 
                rgba(75, 192, 192, 0.35) 45%, 
                rgba(54, 162, 235, 0.35) 60%, 
                rgba(153, 102, 255, 0.35) 75%, 
                transparent 85%);
            z-index: 1;
        }

        .fade-transition {
            transition: opacity 1s ease-in-out, transform 0.5s ease;
        }

        /* Zoom Dramático Optimizado para GPU móvil */
        .zoom-dramatic {
            transition: transform 1.6s cubic-bezier(0.7, 0, 0.3, 1), opacity 1.6s ease-in-out !important;
            transform: scale(6) translateY(-15%) translateZ(0) !important;
            opacity: 0 !important;
            will-change: transform, opacity;
        }

        @keyframes subtle-pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        .animate-subtle {
            animation: subtle-pulse 2.2s ease-in-out infinite;
        }

        .text-handwritten {
            font-family: 'Caveat', cursive;
        }

        /* Glassmorphism/Blur con fallback para WebKit */
        .modal-blur {
            background-color: rgba(0, 0, 0, 0.45);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-gray-100 min-h-full w-full flex flex-col items-center justify-between relative overflow-hidden" id="bodyBg">

    <!-- Canvas de Lluvia y Pétalos -->
    <canvas id="bgCanvas" class="fullscreen-canvas"></canvas>

    <!-- Canvas de Galaxia Interactiva -->
    <canvas id="galaxyCanvas" class="fullscreen-canvas"></canvas>
    
    <!-- Capa de Arcoíris -->
    <div id="rainbowLayer" class="rainbow-arc"></div>

    <!-- Encabezado / Título Principal Superior -->
    <header class="relative z-10 w-full safe-area-top px-4 text-center pointer-events-none">
        <h1 id="mainTitle" class="text-2xl sm:text-4xl md:text-5xl font-extrabold tracking-wide text-gray-300 drop-shadow-lg transition-all duration-700 leading-tight">
            No me alcanzó para las flores :(
        </h1>
    </header>

    <!-- Panel "Presiona la flor" (Optimizado para pantallas chicas e iPhone SE) -->
    <div id="sideTextPanel" class="fixed right-4 sm:right-12 top-1/2 -translate-y-1/2 z-20 opacity-0 translate-x-8 transition-all duration-1000 pointer-events-none flex flex-col items-center safe-area-right">
        <div class="text-amber-900 font-bold text-2xl sm:text-4xl md:text-5xl tracking-wide text-handwritten animate-subtle drop-shadow-[0_2px_6px_rgba(255,255,255,0.9)] flex items-center gap-2 sm:gap-3 bg-amber-100/60 backdrop-blur-xs px-4 py-2 rounded-2xl border border-amber-300/50">
            <span>Presiona la flor</span>
            <span class="text-2xl sm:text-3xl">👈</span>
        </div>
    </div>

    <!-- Modal de Mensajes Especiales (Ajustado a centro de pantalla iOS) -->
    <div id="messageModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-opacity duration-300 modal-blur safe-area-bottom safe-area-top safe-area-left safe-area-right">
        <div class="bg-amber-50 text-amber-950 p-6 sm:p-8 rounded-3xl max-w-xs sm:max-w-sm w-full text-center shadow-2xl border-4 border-amber-300 relative transform transition-all scale-90 duration-300 active:scale-100 flex flex-col items-center" id="modalCard">
            <div class="text-4xl mb-2 animate-bounce">🌻✨</div>
            <h3 id="modalTitle" class="text-xl sm:text-2xl font-bold mb-2 text-amber-800">Un mensaje especial</h3>
            <p id="modalBody" class="text-base sm:text-lg text-amber-900 leading-relaxed font-medium mb-4">...</p>
            
            <!-- Elemento para el GIF de baile -->
            <img id="danceGif" src="./imagenes/baile.gif" alt="Baile" class="hidden w-36 h-36 object-contain mb-4 rounded-xl shadow-md" />

            <!-- Elemento para la imagen Seduce -->
            <img id="seduceImg" src="./imagenes/seduce.jpg" alt="Seduce" class="hidden w-36 h-36 object-contain mb-4 rounded-xl shadow-md" />

            <button id="closeModalBtn" class="bg-amber-400 hover:bg-amber-500 active:bg-amber-600 text-amber-950 font-bold px-6 py-3 rounded-full shadow-lg active:scale-95 transition-all text-base w-full sm:w-auto touch-manipulation">
                Obrigado 🙌🏻
            </button>
        </div>
    </div>

    <!-- Reproductores de Audio -->
    <audio id="audioDance" src="./musica/izqder.mp3" preload="auto"></audio>
    <audio id="audioPrimavera" src="./musica/floresamarillas.mp3" preload="auto"></audio>
    <audio id="audioCareless" src="./musica/careless.mp3" preload="auto"></audio>

    <!-- Contenedor Principal de Imágenes centradas abajo -->
    <main class="relative z-10 w-full flex-1 flex items-end justify-center pb-0 safe-area-bottom pointer-events-none">
        <div class="relative w-full max-w-sm sm:max-w-md md:max-w-lg flex justify-center items-end px-4">
            
            <!-- Imagen 1: Dog.png (Perrito Triste) -->
            <img 
                id="dogSad" 
                src="./imagenes/Dog.png" 
                alt="Perrito sin flores" 
                class="w-auto h-auto max-h-[50dvh] max-w-full object-contain fade-transition opacity-100 block pointer-events-none select-none"
                onerror="this.onerror=null; this.src='https://placehold.co/400x400/333333/ffffff?text=Dog.png';"
            />

            <!-- Imagen 2: Dog 1.png (Perrito Feliz con Flores - Táctil) -->
            <img 
                id="dogHappy" 
                src="./imagenes/Dog 1.png" 
                alt="Perrito con flores" 
                class="w-auto h-auto max-h-[50dvh] max-w-full object-contain fade-transition opacity-0 absolute bottom-0 cursor-pointer pointer-events-none select-none touch-manipulation"
                onerror="this.onerror=null; this.src='https://placehold.co/400x400/fde047/333333?text=Dog+1.png';"
            />

        </div>
    </main>

    <script>
        // DOM Elements
        const bodyBg = document.getElementById('bodyBg');
        const bgCanvas = document.getElementById('bgCanvas');
        const galaxyCanvas = document.getElementById('galaxyCanvas');
        const rainbowLayer = document.getElementById('rainbowLayer');
        const mainTitle = document.getElementById('mainTitle');
        const dogSad = document.getElementById('dogSad');
        const dogHappy = document.getElementById('dogHappy');
        const sideTextPanel = document.getElementById('sideTextPanel');

        const messageModal = document.getElementById('messageModal');
        const modalCard = document.getElementById('modalCard');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        const closeModalBtn = document.getElementById('closeModalBtn');
        
        // Elementos visuales y de audio añadidos
        const danceGif = document.getElementById('danceGif');
        const seduceImg = document.getElementById('seduceImg');
        const audioDance = document.getElementById('audioDance');
        const audioPrimavera = document.getElementById('audioPrimavera');
        const audioCareless = document.getElementById('audioCareless');

        const ctxBg = bgCanvas.getContext('2d', { alpha: true });
        const ctxGalaxy = galaxyCanvas.getContext('2d', { alpha: true });

        let currentScene = "rain"; // "rain", "sun", "galaxy"
        let isTransitioning = false;
        let isMobile = window.innerWidth <= 768;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        // --- Manejo de Dimensionamiento del Canvas Optimizado ---
        function resizeAll() {
            isMobile = window.innerWidth <= 768;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            const width = window.innerWidth;
            const height = window.innerHeight;

            bgCanvas.width = width * dpr;
            bgCanvas.height = height * dpr;
            bgCanvas.style.width = width + 'px';
            bgCanvas.style.height = height + 'px';

            galaxyCanvas.width = width * dpr;
            galaxyCanvas.height = height * dpr;
            galaxyCanvas.style.width = width + 'px';
            galaxyCanvas.style.height = height + 'px';

            ctxBg.scale(dpr, dpr);
            ctxGalaxy.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeAll, { passive: true });
        resizeAll();

        // --- 1. Lluvia y Pétalos (Fondo Inicial) ---
        const drops = Array.from({ length: isMobile ? 45 : 90 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            length: Math.random() * 18 + 8,
            speed: Math.random() * 6 + 4,
            opacity: Math.random() * 0.35 + 0.1
        }));

        const petals = Array.from({ length: isMobile ? 16 : 30 }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            size: Math.random() * 6 + 4,
            speedY: Math.random() * 1.4 + 0.5,
            speedX: Math.random() * 0.8 - 0.4,
            color: ['#ffb7b2', '#ffdac1', '#e2f0cb', '#fbe7c6', '#fde047'][Math.floor(Math.random() * 5)],
            angle: Math.random() * 360
        }));

        // --- 2. Galaxia de 8 Brazos Interactiva ---
        let mouseX = 0;
        let mouseY = 0;
        let targetTiltX = 0;
        let targetTiltY = 0;
        let currentTiltX = 0;
        let currentTiltY = 0;
        let galaxyRotation = 0;

        function updatePointerPos(clientX, clientY) {
            mouseX = (clientX / window.innerWidth) * 2 - 1;
            mouseY = (clientY / window.innerHeight) * 2 - 1;
        }

        window.addEventListener('mousemove', (e) => updatePointerPos(e.clientX, e.clientY), { passive: true });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointerPos(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        const ARM_COUNT = 8;
        const PARTICLES_PER_ARM = isMobile ? 80 : 160;
        const galaxyParticles = [];
        const secondarySunflowers = [];
        const specialSunflowers = [];
        const sparkles = [];

        const specialMessages = [
            {
                title: "Izquierda Derecha 🕺🏻💃🏻",
                body: "Buenos pasitos..."
            },
            {
                title: "¿Cuando salimos a tomarnos un cafecito? (o tecito si esq no te gusta el cafe)",
                body: "cof cof"
            },
            {
                title: "Viva la primavera",
                body: "Finalmente todo se pondra mas verdecito y que bkn es ver verdecito"
            }
        ];

        function initGalaxy() {
            galaxyParticles.length = 0;
            const minDim = Math.min(window.innerWidth, window.innerHeight);

            for (let arm = 0; arm < ARM_COUNT; arm++) {
                const isSparkArm = (arm % 2 === 0);
                const armAngleOffset = (arm * 2 * Math.PI) / ARM_COUNT;

                for (let i = 0; i < PARTICLES_PER_ARM; i++) {
                    const distRatio = Math.pow(Math.random(), 1.2);
                    const distance = distRatio * (minDim * 0.6) + 30;
                    const spiralAngle = distance * 0.008;
                    const spread = (Math.random() - 0.5) * (0.35 + distRatio * 0.35);
                    const angle = armAngleOffset + spiralAngle + spread;
                    const z = (Math.random() - 0.5) * 60 * (1 - distRatio * 0.5);

                    galaxyParticles.push({
                        arm: arm,
                        isSpark: isSparkArm,
                        distance: distance,
                        angle: angle,
                        z: z,
                        size: isSparkArm ? Math.random() * 2.5 + 1 : Math.random() * 5 + 2.5,
                        color: isSparkArm 
                            ? ['#FFF700', '#FFEA00', '#FFD700', '#FFFFFF', '#FFAA00'][Math.floor(Math.random() * 5)]
                            : ['#FF69B4', '#FFB6C1', '#FFA07A', '#FFD700', '#FF6347', '#E6E6FA'][Math.floor(Math.random() * 6)],
                        rotation: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.03
                    });
                }
            }

            secondarySunflowers.length = 0;
            for (let i = 0; i < 4; i++) {
                secondarySunflowers.push(createSecondarySunflower());
            }

            specialSunflowers.length = 0;
            for (let i = 0; i < 3; i++) {
                const distance = (i + 1) * (minDim * 0.15) + 50;
                const angle = (i * (2 * Math.PI / 3)) + Math.PI / 4;
                specialSunflowers.push({
                    distance: distance,
                    angle: angle,
                    z: 0,
                    scale: isMobile ? 0.38 : 0.45,
                    orbitSpeed: 0.0015 * (i % 2 === 0 ? 1 : -1),
                    screenX: 0,
                    screenY: 0,
                    hitRadius: isMobile ? 55 : 40,
                    hovered: false,
                    messageData: specialMessages[i]
                });
            }
        }

        function createSecondarySunflower() {
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            return {
                distance: Math.random() * (minDim * 0.35) + 60,
                angle: Math.random() * Math.PI * 2,
                z: (Math.random() - 0.5) * 40,
                scale: isMobile ? 0.20 : 0.25,
                orbitSpeed: (Math.random() * 0.002 + 0.001) * (Math.random() > 0.5 ? 1 : -1),
                screenX: 0,
                screenY: 0,
                hitRadius: isMobile ? 45 : 30,
                hovered: false
            };
        }

        function drawSunflower(ctx, x, y, scale, hasHalo = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            if (hasHalo) {
                const haloGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 85);
                haloGlow.addColorStop(0, 'rgba(255, 215, 0, 0.9)');
                haloGlow.addColorStop(0.4, 'rgba(255, 140, 0, 0.4)');
                haloGlow.addColorStop(1, 'rgba(255, 140, 0, 0)');
                ctx.fillStyle = haloGlow;
                ctx.beginPath();
                ctx.arc(0, 0, 85, 0, Math.PI * 2);
                ctx.fill();
            }

            const glow = ctx.createRadialGradient(0, 0, 5, 0, 0, 60);
            glow.addColorStop(0, 'rgba(255, 230, 0, 0.8)');
            glow.addColorStop(0.5, 'rgba(255, 170, 0, 0.2)');
            glow.addColorStop(1, 'rgba(255, 140, 0, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(0, 0, 60, 0, Math.PI * 2);
            ctx.fill();

            const layers = [
                { count: 14, length: 46, width: 14, color: '#FFD700' },
                { count: 14, length: 38, width: 12, color: '#FFAB00' }
            ];

            layers.forEach((layer, idx) => {
                const step = (Math.PI * 2) / layer.count;
                const offset = idx * (step / 2);
                for (let i = 0; i < layer.count; i++) {
                    const angle = i * step + offset;
                    ctx.save();
                    ctx.rotate(angle);
                    ctx.fillStyle = layer.color;
                    ctx.beginPath();
                    ctx.moveTo(0, -10);
                    ctx.quadraticCurveTo(layer.width, -layer.length / 2, 0, -layer.length);
                    ctx.quadraticCurveTo(-layer.width, -layer.length / 2, 0, -10);
                    ctx.fill();
                    ctx.restore();
                }
            });

            ctx.fillStyle = '#4A2A0C';
            ctx.beginPath();
            ctx.arc(0, 0, 15, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2A1504';
            const seeds = 35;
            const phi = 2.39996;
            for (let i = 0; i < seeds; i++) {
                const r = Math.sqrt(i) * 2.2;
                const theta = i * phi;
                ctx.beginPath();
                ctx.arc(r * Math.cos(theta), r * Math.sin(theta), 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function triggerFocalSparkle() {
            if (currentScene !== "galaxy") return;
            const minDim = Math.min(window.innerWidth, window.innerHeight);
            
            sparkles.push({
                distance: Math.random() * (minDim * 0.4) + 40,
                angle: Math.random() * Math.PI * 2,
                z: (Math.random() - 0.5) * 50,
                maxRadius: Math.random() * 10 + 5,
                currentFrame: 0,
                maxFrames: Math.floor(Math.random() * 16 + 14),
                color: ['#FFFFFF', '#FFF700', '#FFEA00', '#00FFFF'][Math.floor(Math.random() * 4)]
            });
        }

        setInterval(() => {
            if (currentScene === "galaxy" && Math.random() < 0.6) {
                triggerFocalSparkle();
            }
        }, 1000);

        let lastInteractionTime = 0;

        function handleInteraction(clientX, clientY, e) {
            if (currentScene !== "galaxy") return;

            const now = Date.now();
            if (now - lastInteractionTime < 300) return;
            lastInteractionTime = now;

            if (e && e.cancelable) {
                e.preventDefault();
            }

            for (let sf of specialSunflowers) {
                const dx = clientX - sf.screenX;
                const dy = clientY - sf.screenY;
                const dist = Math.hypot(dx, dy);

                if (dist < sf.hitRadius) {
                    confetti({
                        particleCount: isMobile ? 30 : 50,
                        spread: 70,
                        origin: { x: sf.screenX / window.innerWidth, y: sf.screenY / window.innerHeight },
                        colors: ['#FFD700', '#FFA500', '#FF69B4', '#FFFFFF'],
                        disableForReducedMotion: true
                    });

                    openModal(sf.messageData.title, sf.messageData.body);
                    return;
                }
            }

            secondarySunflowers.forEach((sf, idx) => {
                const dx = clientX - sf.screenX;
                const dy = clientY - sf.screenY;
                const dist = Math.hypot(dx, dy);

                if (dist < sf.hitRadius) {
                    confetti({
                        particleCount: isMobile ? 15 : 25,
                        spread: 50,
                        origin: { x: sf.screenX / window.innerWidth, y: sf.screenY / window.innerHeight },
                        colors: ['#FFD700', '#FFAA00', '#FFFFFF'],
                        disableForReducedMotion: true
                    });

                    secondarySunflowers[idx] = createSecondarySunflower();
                }
            });
        }

        galaxyCanvas.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                handleInteraction(touch.clientX, touch.clientY, e);
            }
        }, { passive: false });

        galaxyCanvas.addEventListener('click', (e) => {
            handleInteraction(e.clientX, e.clientY, e);
        });

        // Detener todos los audios de forma segura
        function stopAllAudios() {
            [audioDance, audioPrimavera, audioCareless].forEach(audio => {
                if (audio) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
        }

        // Abrir / Cerrar Modal con lógica para los tres mensajes
        function openModal(title, body) {
            modalTitle.innerText = title;
            modalBody.innerText = body;

            // Limpieza previa de imágenes
            danceGif.classList.add('hidden');
            seduceImg.classList.add('hidden');

            // Detener cualquier audio anterior antes de iniciar uno nuevo
            stopAllAudios();

            // 1. Mensaje Izquierda Derecha
            if (title === "Izquierda Derecha 🕺🏻💃🏻") {
                danceGif.classList.remove('hidden');
                if (audioDance) {
                    audioDance.play().catch(e => console.log("Error al reproducir audio:", e));
                }
            } 
            // 2. Mensaje Viva la primavera
            else if (title === "Viva la primavera") {
                if (audioPrimavera) {
                    audioPrimavera.play().catch(e => console.log("Error al reproducir audio:", e));
                }
            } 
            // 3. Mensaje Cafecito / Tecito
            else if (title.includes("cafecito")) {
                seduceImg.classList.remove('hidden');
                if (audioCareless) {
                    audioCareless.play().catch(e => console.log("Error al reproducir audio:", e));
                }
            }

            messageModal.classList.remove('opacity-0', 'pointer-events-none');
            messageModal.classList.add('opacity-100', 'pointer-events-auto');
            modalCard.classList.remove('scale-90');
            modalCard.classList.add('scale-100');
        }

        function closeModal() {
            messageModal.classList.remove('opacity-100', 'pointer-events-auto');
            messageModal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');

            // Detener audios al cerrar modal
            stopAllAudios();
        }

        closeModalBtn.addEventListener('click', closeModal);
        messageModal.addEventListener('click', (e) => {
            if (e.target === messageModal) closeModal();
        });

        // --- Bucle Principal de Renderizado ---
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;

            const width = window.innerWidth;
            const height = window.innerHeight;

            ctxBg.clearRect(0, 0, width, height);

            if (currentScene === "rain") {
                ctxBg.strokeStyle = '#ffffff';
                ctxBg.lineWidth = 1;
                ctxBg.lineCap = 'round';

                drops.forEach(d => {
                    ctxBg.beginPath();
                    ctxBg.globalAlpha = d.opacity;
                    ctxBg.moveTo(d.x, d.y);
                    ctxBg.lineTo(d.x, d.y + d.length);
                    ctxBg.stroke();

                    d.y += d.speed * (deltaTime * 60);
                    if (d.y > height) {
                        d.y = -d.length;
                        d.x = Math.random() * width;
                    }
                });
            } else if (currentScene === "sun") {
                petals.forEach(p => {
                    ctxBg.save();
                    ctxBg.globalAlpha = 0.65;
                    ctxBg.fillStyle = p.color;
                    ctxBg.translate(p.x, p.y);
                    ctxBg.rotate((p.angle * Math.PI) / 180);
                    ctxBg.beginPath();
                    ctxBg.ellipse(0, 0, p.size, p.size / 2, 0, 0, 2 * Math.PI);
                    ctxBg.fill();
                    ctxBg.restore();

                    p.y += p.speedY * (deltaTime * 60);
                    p.x += Math.sin(p.y * 0.02) * 0.5;
                    p.angle += 0.5 * (deltaTime * 60);

                    if (p.y > height) {
                        p.y = -10;
                        p.x = Math.random() * width;
                    }
                });
            }

            if (currentScene === "galaxy") {
                ctxGalaxy.clearRect(0, 0, width, height);

                targetTiltX = mouseY * 0.3;
                targetTiltY = mouseX * 0.3;
                currentTiltX += (targetTiltX - currentTiltX) * 0.06;
                currentTiltY += (targetTiltY - currentTiltY) * 0.06;

                galaxyRotation += 0.002 * (deltaTime * 60);

                const centerX = width / 2;
                const centerY = height / 2;

                const renderQueue = [];

                galaxyParticles.forEach(p => {
                    const currAngle = p.angle + galaxyRotation;
                    let x3d = Math.cos(currAngle) * p.distance;
                    let y3d = Math.sin(currAngle) * p.distance;
                    let z3d = p.z;

                    let cosX = Math.cos(currentTiltX), sinX = Math.sin(currentTiltX);
                    let cosY = Math.cos(currentTiltY), sinY = Math.sin(currentTiltY);

                    let y1 = y3d * cosX - z3d * sinX;
                    let z1 = y3d * sinX + z3d * cosX;
                    let x2 = x3d * cosY + z1 * sinY;
                    let z2 = -x3d * sinY + z1 * cosY;

                    const perspective = 550 / (550 + z2);

                    renderQueue.push({
                        type: 'particle',
                        x: centerX + x2 * perspective,
                        y: centerY + y1 * perspective,
                        scale: perspective,
                        z2: z2,
                        isSpark: p.isSpark,
                        size: p.size * perspective,
                        color: p.color,
                        rotation: p.rotation + p.rotSpeed
                    });
                });

                secondarySunflowers.forEach(sf => {
                    sf.angle += sf.orbitSpeed * (deltaTime * 60);
                    const currAngle = sf.angle + galaxyRotation;

                    let x3d = Math.cos(currAngle) * sf.distance;
                    let y3d = Math.sin(currAngle) * sf.distance;
                    let z3d = sf.z;

                    let cosX = Math.cos(currentTiltX), sinX = Math.sin(currentTiltX);
                    let cosY = Math.cos(currentTiltY), sinY = Math.sin(currentTiltY);

                    let y1 = y3d * cosX - z3d * sinX;
                    let z1 = y3d * sinX + z3d * cosX;
                    let x2 = x3d * cosY + z1 * sinY;
                    let z2 = -x3d * sinY + z1 * cosY;

                    const perspective = 550 / (550 + z2);
                    sf.screenX = centerX + x2 * perspective;
                    sf.screenY = centerY + y1 * perspective;

                    renderQueue.push({
                        type: 'sunflower',
                        x: sf.screenX,
                        y: sf.screenY,
                        scale: sf.scale * perspective,
                        hasHalo: false,
                        z2: z2
                    });
                });

                specialSunflowers.forEach(sf => {
                    sf.angle += sf.orbitSpeed * (deltaTime * 60);
                    const currAngle = sf.angle + galaxyRotation;

                    let x3d = Math.cos(currAngle) * sf.distance;
                    let y3d = Math.sin(currAngle) * sf.distance;
                    let z3d = sf.z;

                    let cosX = Math.cos(currentTiltX), sinX = Math.sin(currentTiltX);
                    let cosY = Math.cos(currentTiltY), sinY = Math.sin(currentTiltY);

                    let y1 = y3d * cosX - z3d * sinX;
                    let z1 = y3d * sinX + z3d * cosX;
                    let x2 = x3d * cosY + z1 * sinY;
                    let z2 = -x3d * sinY + z1 * cosY;

                    const perspective = 550 / (550 + z2);
                    sf.screenX = centerX + x2 * perspective;
                    sf.screenY = centerY + y1 * perspective;

                    renderQueue.push({
                        type: 'sunflower',
                        x: sf.screenX,
                        y: sf.screenY,
                        scale: sf.scale * perspective * (1.0 + Math.sin(Date.now() * 0.003) * 0.05),
                        hasHalo: true,
                        z2: z2
                    });
                });

                for (let i = sparkles.length - 1; i >= 0; i--) {
                    const sp = sparkles[i];
                    sp.currentFrame++;
                    
                    if (sp.currentFrame >= sp.maxFrames) {
                        sparkles.splice(i, 1);
                        continue;
                    }

                    const currAngle = sp.angle + galaxyRotation;
                    let x3d = Math.cos(currAngle) * sp.distance;
                    let y3d = Math.sin(currAngle) * sp.distance;
                    let z3d = sp.z;

                    let cosX = Math.cos(currentTiltX), sinX = Math.sin(currentTiltX);
                    let cosY = Math.cos(currentTiltY), sinY = Math.sin(currentTiltY);

                    let y1 = y3d * cosX - z3d * sinX;
                    let z1 = y3d * sinX + z3d * cosX;
                    let x2 = x3d * cosY + z1 * sinY;
                    let z2 = -x3d * sinY + z1 * cosY;

                    const perspective = 550 / (550 + z2);
                    const progress = sp.currentFrame / sp.maxFrames;
                    const opacity = Math.sin(progress * Math.PI);
                    const radius = sp.maxRadius * Math.sin(progress * Math.PI) * perspective;

                    renderQueue.push({
                        type: 'sparkle',
                        x: centerX + x2 * perspective,
                        y: centerY + y1 * perspective,
                        radius: radius,
                        opacity: opacity,
                        color: sp.color,
                        z2: z2
                    });
                }

                renderQueue.sort((a, b) => b.z2 - a.z2);

                renderQueue.forEach(item => {
                    if (item.type === 'particle') {
                        ctxGalaxy.save();
                        ctxGalaxy.translate(item.x, item.y);
                        ctxGalaxy.fillStyle = item.color;
                        ctxGalaxy.beginPath();

                        if (item.isSpark) {
                            ctxGalaxy.arc(0, 0, item.size, 0, Math.PI * 2);
                        } else {
                            ctxGalaxy.rotate(item.rotation);
                            ctxGalaxy.ellipse(0, 0, item.size, item.size * 0.5, 0, 0, Math.PI * 2);
                        }
                        ctxGalaxy.fill();
                        ctxGalaxy.restore();
                    } else if (item.type === 'sunflower') {
                        drawSunflower(ctxGalaxy, item.x, item.y, item.scale, item.hasHalo);
                    } else if (item.type === 'sparkle') {
                        ctxGalaxy.save();
                        ctxGalaxy.translate(item.x, item.y);
                        ctxGalaxy.globalAlpha = item.opacity;
                        
                        const g = ctxGalaxy.createRadialGradient(0, 0, 0, 0, 0, item.radius);
                        g.addColorStop(0, '#FFFFFF');
                        g.addColorStop(0.4, item.color);
                        g.addColorStop(1, 'rgba(255, 255, 255, 0)');
                        
                        ctxGalaxy.fillStyle = g;
                        ctxGalaxy.beginPath();
                        ctxGalaxy.arc(0, 0, item.radius, 0, Math.PI * 2);
                        ctxGalaxy.fill();

                        ctxGalaxy.strokeStyle = '#FFFFFF';
                        ctxGalaxy.lineWidth = 1.2;
                        ctxGalaxy.beginPath();
                        ctxGalaxy.moveTo(-item.radius * 1.3, 0); ctxGalaxy.lineTo(item.radius * 1.3, 0);
                        ctxGalaxy.moveTo(0, -item.radius * 1.3); ctxGalaxy.lineTo(0, item.radius * 1.3);
                        ctxGalaxy.stroke();

                        ctxGalaxy.restore();
                    }
                });

                drawSunflower(ctxGalaxy, centerX, centerY, (isMobile ? 0.85 : 1.1) + Math.sin(Date.now() * 0.002) * 0.03);
            }

            requestAnimationFrame(animate);
        }

        // --- Transición Automática (5 Segundos) ---
        setTimeout(() => {
            currentScene = "sun";

            bodyBg.classList.remove('bg-gray-800');
            bodyBg.classList.add('bg-amber-100');
            rainbowLayer.style.opacity = '1';

            mainTitle.innerText = "ahh te la creiste";
            mainTitle.classList.remove('text-gray-300');
            mainTitle.classList.add('text-amber-900', 'scale-105');

            dogSad.classList.remove('opacity-100');
            dogSad.classList.add('opacity-0');

            dogHappy.classList.remove('opacity-0', 'pointer-events-none');
            dogHappy.classList.add('opacity-100', 'pointer-events-auto');

            sideTextPanel.classList.remove('opacity-0', 'translate-x-8');
            sideTextPanel.classList.add('opacity-100', 'translate-x-0');

        }, 5000);

        // --- Transición a Galaxia ---
        function startGalaxyTransition(e) {
            if (isTransitioning) return;
            isTransitioning = true;

            if (e && e.cancelable) e.preventDefault();

            confetti({
                particleCount: isMobile ? 50 : 80,
                spread: 90,
                origin: { y: 0.8 },
                colors: ['#ffd700', '#ffb703', '#ff4d6d', '#ffffff'],
                disableForReducedMotion: true
            });

            mainTitle.style.opacity = '0';
            sideTextPanel.style.opacity = '0';

            dogHappy.classList.add('zoom-dramatic');

            setTimeout(() => {
                initGalaxy();
                currentScene = "galaxy";
                galaxyCanvas.style.pointerEvents = "auto";
                galaxyCanvas.style.opacity = "1";
            }, 600);
        }

        dogHappy.addEventListener('touchend', startGalaxyTransition, { passive: false });
        dogHappy.addEventListener('click', startGalaxyTransition);

        window.onload = function() {
            requestAnimationFrame(animate);
        };
    </script>
</body>
</html>
